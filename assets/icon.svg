<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    clide's app icon.

    A near-black tile with the five-bar mark in white: the same monochrome
    system as the app, so the Dock icon and the window are recognisably one
    thing. The mark is the only detail; it has to survive 16px.

    Standard macOS geometry: an 824px body centred on the 1024 canvas, a soft
    shadow beneath, and a hairline of light along the top edge so the dark tile
    still reads against a dark Dock or desktop.
  -->
  <defs>
    <linearGradient id="body" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#1F1F22"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9B9C2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <ellipse cx="512" cy="512" rx="330" ry="260" fill="url(#glow)"/>
  </g>

  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g fill="url(#bar)">
    <rect x="285" y="448" width="62" height="128" rx="31"/>
    <rect x="383" y="383" width="62" height="258" rx="31"/>
    <rect x="481" y="312" width="62" height="400" rx="31"/>
    <rect x="579" y="408" width="62" height="208" rx="31"/>
    <rect x="677" y="462" width="62" height="100" rx="31"/>
  </g>
</svg>
