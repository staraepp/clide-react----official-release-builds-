[package]
name = "clide"
version = "2.0.0"
description = "Clide — system-wide dictation for macOS"
edition = "2021"
rust-version = "1.77"
default-run = "clide"

[lib]
name = "clide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Local inference. Metal-accelerated on Apple Silicon; no network at run time.
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
futures-util = "0.3"
# Local Parakeet via ONNX Runtime.
parakeet-rs = "0.3"
# Apple Intelligence's on-device model, for the Rewrite mode. macOS 26+ only.
foundation-models = { version = "0.11", features = ["macos_26_0", "async"] }
# Apple's built-in speech recognition.
objc2-speech = "0.3"
objc2-foundation = "0.3"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }
objc2 = "0.6"
block2 = "0.6"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cpal = "0.15"
hound = "3.5"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
semver = "1"


[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan"] }
objc2 = "0.6"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
